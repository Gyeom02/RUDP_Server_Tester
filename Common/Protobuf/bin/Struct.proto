syntax = "proto3";
package Protocol;

import "Enum.proto";

message Player
{
	int32 id = 1;
	int32 roomid = 2; 
	int32 roomlistid = 3;
	int32 teamnum = 4;
	string name = 5;
	
	// Ω∫≈» ¡§∫∏...
}
message Position
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message Rotation
{
	float yaw = 1;
	float pitch = 2;
	float roll = 3;
}

message Velocity
{
	float vx = 1;
	float vy = 2;
	float vz = 3;
}

message MoveList
{
	int32 roomprimeid = 1;
	int32 roomlistid = 2;
	int32 movetolistid = 3;
	int32 moveteamnum = 4;
}

message MoveTeam
{
	int32 moveteamnum = 1;
	int32 roomprimeid = 2;
	int32 roomlistid = 3;
	int32 movetolistid = 4;
}

message PlayerMove
{
	int32 roomid = 1;
	int32 primid = 2;
	Position pos = 3;
	Rotation rot = 4;
	Velocity vel = 5;
}